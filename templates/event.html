{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row g-5 align-items-start">

        <!-- фотка -->
        <div class="col-lg-8">

            <img src="{{ event.image }}"
                 class="img-fluid rounded-5 shadow-sm w-100"
                 style="height: 500px; object-fit: cover;">

            <!-- описание -->
            <div class="mt-4">

                <h2 class="fw-bold mb-3">
                    Описание:
                </h2>

                <p class="fs-5">
                    {{ event.description }}
                </p>

            </div>

            <!-- адрес -->
            <div class="mt-5">

                <h2 class="fw-bold">
                    Адрес:
                </h2>

                <p class="fs-4 mt-3">
                    {{ event.address }}
                </p>

            </div>

            <!-- зарегистрироваться -->
            <div class="mt-5">

                <a href="#"
                   class="btn btn-lg rounded-pill px-5 py-3 fw-bold"
                   style="background: #FFFACD; border: none;">

                    Зарегистрироваться

                </a>

            </div>

        </div>

        <!-- дата время и категория -->
        <div class="col-lg-4">

            <h1 class="fw-bold display-3 mb-4">
                {{ event.title }}
            </h1>

            <div class="mb-4">

                <h3 class="fw-bold mb-2">
                    Дата:
                </h3>

                <p class="fs-4">
                    {{ event.date }}
                </p>

            </div>

            <div class="mb-5">

                <h3 class="fw-bold mb-2">
                    Время:
                </h3>

                <p class="fs-4">
                    {{ event.time }}
                </p>

            </div>

            <div class="mb-5">

                <h3 class="fw-bold mb-2">
                    Категория:
                </h3>

                <p class="fs-4">
                    {{ event.category }}
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
